name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request cancels the older run, to save macOS minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15   # Xcode 16+: the tests use Swift Testing
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
