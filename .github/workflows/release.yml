name: Release

# Press "Run workflow" on the Actions tab, type a version, and this builds Notch,
# tags the commit and publishes a GitHub Release with Notch-<version>.zip attached.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 1.0.0"
        required: true

permissions:
  contents: write   # to create the tag and the release

# Never two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15   # Xcode 16+: DynamicNotchKit needs Swift 6, the tests use Swift Testing
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version and branch
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$VERSION'"; exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases are made from main. Pick main in the 'Use workflow from' list."; exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check the version isn't taken
        run: |
          # ls-remote exits 0 if the tag exists, 2 if it doesn't, anything else if it couldn't look.
          code=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null || code=$?
          if [[ $code -eq 0 ]]; then
            echo "::error::v$VERSION has already been released"; exit 1
          elif [[ $code -ne 2 ]]; then
            echo "::error::Couldn't check whether v$VERSION exists (git exit code $code)"; exit 1
          fi

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Test
        run: swift test

      # Every release is signed with the same self-signed certificate, so macOS keeps Notch's
      # permissions across updates and the app can check an update really came from here.
      - name: Load the signing certificate
        env:
          P12: ${{ secrets.NOTCH_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.NOTCH_SIGNING_PASSWORD }}
        run: |
          if [[ -z "$P12" || -z "$P12_PASSWORD" ]]; then
            echo "::error::The NOTCH_SIGNING_P12 and NOTCH_SIGNING_PASSWORD secrets aren't set"; exit 1
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          trap 'rm -f "$RUNNER_TEMP/signing.p12"' EXIT
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" >/dev/null
          echo "NOTCH_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Build the app (Apple Silicon and Intel)
        env:
          NOTCH_UNIVERSAL: "1"
          NOTCH_VERSION: ${{ inputs.version }}
          NOTCH_BUILD: ${{ github.run_number }}
          NOTCH_SIGN_IDENTITY: Notch Release Signing
        run: ./build.sh

      # Installed copies only accept updates signed by this exact certificate (SHA-1 of the leaf).
      # A different certificate would publish a release nobody can update to.
      - name: Check it's signed with the release certificate
        run: |
          codesign -dr - build/Notch.app 2>&1 \
            | grep -qF 'certificate leaf = H"19180d694e220d1d49ea3447a26528fcd16f1530"' \
            || { echo "::error::App isn't signed with Notch's release certificate"; exit 1; }

      - name: Zip it
        run: ditto -c -k --keepParent build/Notch.app "Notch-$VERSION.zip"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          ## Install

          1. Download **Notch-VERSION.zip** below and open it.
          2. Drag **Notch.app** to your Applications folder, then open it.
          3. macOS blocks it the first time, because the app isn't from the App Store or a paid Apple developer account.
             Within the hour, go to **System Settings → Privacy & Security**, scroll down, click **Open Anyway** and confirm.
          4. Allow access to **Calendars**, and to control **Spotify** or **Music** if asked.

          If macOS says the app **is damaged and can't be opened**, run this in Terminal, then open it again:

              xattr -dr com.apple.quarantine /Applications/Notch.app

          Updating: quit Notch, replace the app in Applications and do step 3 again.
          Later updates install themselves (see the README).

          Needs macOS 14 Sonoma or later.

          EOF
          sed -i '' "s/VERSION/$VERSION/" notes.md
          gh release create "v$VERSION" "Notch-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "Notch $VERSION" \
            --notes-file notes.md \
            --generate-notes
